name: Deploy web installer to GitHub Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      stable_ref: ${{ steps.refs.outputs.stable_ref }}
      stable_version: ${{ steps.refs.outputs.stable_version }}
      latest_ref: ${{ steps.refs.outputs.latest_ref }}
    steps:
      - name: Resolve stable release and latest source
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            echo "stable_ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "stable_version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            STABLE_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            echo "stable_ref=$STABLE_TAG" >> "$GITHUB_OUTPUT"
            echo "stable_version=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = push ]; then
            echo "latest_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "latest_ref=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable, latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.channel == 'stable' && needs.refs.outputs.stable_ref || needs.refs.outputs.latest_ref }}

      # GLUE: a stable release may predate the dual-channel staging interface.
      # Use the workflow revision's preparer until every supported release has it.
      - name: Checkout Pages staging tool
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .pages-tooling
          sparse-checkout: tools/prepare_pages_site.py
          sparse-checkout-cone-mode: false

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Cache Arduino toolchain
        uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: ${{ runner.os }}-arduino-${{ hashFiles('sketch.yaml') }}

      - name: Restore generated sprite inputs
        id: sprite-cache
        uses: actions/cache/restore@v5
        with:
          path: tools/sdcard/mons
          key: ${{ runner.os }}-sprites-${{ hashFiles('tools/pack_pmd.py', 'tools/make_thumbs.py', 'tools/dex_data.py') }}

      - name: Generate sprite inputs
        if: steps.sprite-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 tools/pack_pmd.py --workers 10
          python3 tools/make_thumbs.py

      - name: Save generated sprite inputs
        if: steps.sprite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tools/sdcard/mons
          key: ${{ steps.sprite-cache.outputs.cache-primary-key }}

      - name: Build and validate installer assets
        env:
          TAMAPOKE_VERSION: ${{ matrix.channel == 'stable' && needs.refs.outputs.stable_version || '' }}
        run: bash tools/build_web.sh

      - name: Prepare static site
        env:
          SITE_CHANNEL: ${{ matrix.channel }}
        run: |
          BUILD_COMMIT="$(git rev-parse HEAD)"
          python3 .pages-tooling/tools/prepare_pages_site.py _staged \
            --source web \
            --commit "$BUILD_COMMIT" \
            --date "$(git show -s --format=%cs "$BUILD_COMMIT")" \
            --channel "$SITE_CHANNEL"
          if [ "$SITE_CHANNEL" = latest ]; then
            mkdir _site
            mv _staged _site/latest
          else
            mv _staged _site
          fi

      - name: Upload channel artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.channel }}
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download stable and latest sites
        uses: actions/download-artifact@v5
        with:
          pattern: site-*
          path: _site
          merge-multiple: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
