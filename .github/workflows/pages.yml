name: Deploy web installer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Cache Arduino toolchain
        uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: ${{ runner.os }}-arduino-${{ hashFiles('sketch.yaml') }}

      - name: Restore generated sprite inputs
        id: sprite-cache
        uses: actions/cache/restore@v5
        with:
          path: tools/sdcard/mons
          key: ${{ runner.os }}-sprites-${{ hashFiles('tools/pack_pmd.py', 'tools/make_thumbs.py', 'tools/dex_data.py') }}

      - name: Generate sprite inputs
        if: steps.sprite-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 tools/pack_pmd.py --workers 10
          python3 tools/make_thumbs.py

      - name: Save generated sprite inputs
        if: steps.sprite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tools/sdcard/mons
          key: ${{ steps.sprite-cache.outputs.cache-primary-key }}

      - name: Build and validate installer assets
        run: bash tools/build_web.sh

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp web/index.html web/manifest.json _site/
          cp -R web/firmware web/packs _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
